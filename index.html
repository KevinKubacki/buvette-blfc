<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buvette BLFC</title>
<meta name="theme-color" content="#012C94">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --wall:#E8EDF6; --card:#FFFFFF; --ink:#0B1A3F; --muted:#56648A; --rule:#D0D8E8; --soft:#F3F6FC;
  --blue:#012C94; --blue-d:#001B5E; --red:#B81518; --ok:#1F8A4C; --okbg:#DDF2E5; --redbg:#FBE4E5;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--ink);font:16px/1.4 Barlow,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom,0px))}
#status{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;z-index:20;font-size:.74rem;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(0,27,94,.85);color:#fff;border:0}
#status.err{background:var(--red)}

/* barre du haut des écrans */
.top{position:sticky;top:0;z-index:10;margin:0 -14px 14px;background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:4px solid var(--red)}
.top .back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
.top h1{margin:0;font:800 1.5rem/1 var(--cond);flex:1}
.top h1 small{display:block;font:500 .82rem/1.3 Barlow,sans-serif;opacity:.85}

/* accueil */
.hero{margin:0 -14px;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 16px;background:var(--blue);color:#fff;border-bottom:5px solid var(--red);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border:3px solid rgba(255,255,255,.12);border-radius:50%}
.hero .id{display:flex;align-items:center;gap:14px}
.hero img{width:84px;height:84px;flex:none;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--red)}
.hero .club{font:800 1.5rem/1 var(--cond)}
.hero .sub{font-size:.88rem;color:#C3CFF0;margin-top:3px}
.hero .cells{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.hero .cells div{font-size:.78rem;color:#C3CFF0}
.hero .cells b{display:block;font:800 1.45rem/1.1 var(--cond);color:#fff;font-variant-numeric:tabular-nums}

h2{font:800 1.3rem/1.1 var(--cond);margin:20px 2px 10px}
.group{font:700 .98rem/1 var(--cond);color:var(--muted);margin:12px 2px 7px}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--rule)}

.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 8px 7px;min-width:0}
.tile b{display:block;font:800 1.8rem/1 var(--cond);font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{position:relative}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h2row h2{margin-right:auto}
.wa{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;background:#25D366;color:#fff;font-weight:700;font-size:.85rem;padding:8px 13px;margin-top:10px;flex:none}
.wa svg{width:17px;height:17px}
.shot img{width:100%;border-radius:12px;border:1px solid var(--rule);display:block;-webkit-touch-callout:default}
.tile .ic{position:absolute;top:6px;right:6px;font-style:normal;font-size:1.25rem;line-height:1}
.mbtn b .mi{display:block;font-style:normal;font-size:1.7rem;line-height:1;margin-bottom:8px}
.mbtn.main b{display:flex;align-items:center;gap:12px}
.mbtn.main b .mi{font-size:2.3rem;margin:0}
.tile.low{border-color:var(--red);background:#FFF4F4}
.tile.low b{color:var(--red)}
.alert{display:flex;gap:8px;align-items:center;background:#FFF4F4;border:1px solid #F0C4C6;color:var(--red);border-radius:12px;padding:9px 12px;font-weight:600;font-size:.92rem;margin-top:10px}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{border:0;border-radius:16px;background:var(--card);border:1px solid var(--rule);padding:16px 14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.mbtn b{font:800 1.35rem/1 var(--cond);color:var(--blue)}
.mbtn span{font-size:.84rem;color:var(--muted);margin-top:6px}
.mbtn.main{grid-column:1/-1;background:var(--red);border-color:var(--red);min-height:112px}
.mbtn.main b{color:#fff;font-size:1.9rem}
.mbtn.main span{color:#FFD9DA;font-size:.95rem}

/* commun */
label.f{display:block;margin-bottom:10px;font-size:.86rem;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--soft);font-size:1rem;color:var(--ink);font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:11px;padding:13px 16px;font-weight:700;background:var(--blue);color:#fff}
.btn.red{background:var(--red)}
.btn.ghost{background:#E2E8F5;color:var(--blue-d)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.small{padding:7px 11px;font-size:.85rem;border-radius:8px}
.btn.wide{width:100%}
.btn.arm{background:var(--red)!important;color:#fff!important}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EEF1F7}
.line:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.name{font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.neg{color:var(--red)}.pos{color:var(--ok)}
.step{display:flex;align-items:center;border:1px solid var(--rule);border-radius:10px;overflow:hidden;flex:none}
.step button{width:40px;height:40px;border:0;background:#EDF1FA;font-size:1.3rem;font-weight:700;color:var(--blue-d)}
.step input{width:46px;height:40px;border:0;text-align:center;font:700 1.15rem var(--cond);background:#fff;padding:0}
.step.has input{color:var(--blue)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#E9EEF7;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--blue-d);box-shadow:0 1px 2px rgba(11,26,63,.15)}
.tgl{border:0;border-radius:8px;padding:7px 10px;font-size:.82rem;font-weight:700;background:#E4E8F0;color:var(--muted);flex:none}
.tgl.on{background:var(--okbg);color:var(--ok)}
.line.off .grow{opacity:.45}
.chip{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--okbg);color:var(--ok);margin:2px 4px 0 0}
.chip.x{border:0}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;background:#E2E8F5;color:var(--blue-d)}
.pill.low{background:var(--redbg);color:var(--red)}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:.95rem}
details>summary{cursor:pointer;font:700 1rem var(--cond);color:var(--muted);padding:8px 2px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:right;font-weight:600;color:var(--muted);font-size:.76rem;padding:4px 4px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 4px;border-top:1px solid #EEF1F7;text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
.scroll{overflow-x:auto}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:11px;padding:10px 12px;margin:10px 0}
.total b{font:800 1.4rem var(--cond)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 1.5rem/1.1 var(--cond);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* apéro */
.when{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.when input{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:#fff;font-weight:600}
.count{font:800 1.2rem var(--cond);color:var(--blue)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{border:1.5px solid var(--rule);background:#fff;border-radius:12px;padding:13px 12px;text-align:left;font-weight:700;font-size:.98rem;display:flex;align-items:center;gap:8px;min-height:52px}
.pbtn i{font-style:normal;width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);flex:none;display:grid;place-items:center;font-size:.8rem}
.pbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pbtn.on i{background:#fff;border-color:#fff;color:var(--blue)}

/* feuille modale */
#sheet{position:fixed;inset:0;z-index:30;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,20,70,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
#sheet h3{margin:0 0 12px;font:800 1.4rem var(--cond)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.quick button{border:1.5px solid var(--rule);background:#fff;border-radius:11px;padding:14px 0;font:800 1.3rem var(--cond);color:var(--blue)}
.quick button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.plist button{width:100%;display:flex;justify-content:space-between;border:1.5px solid var(--rule);background:#fff;border-radius:11px;padding:11px 12px;margin-bottom:6px;font-weight:600}
.plist button.on{border-color:var(--blue);background:#EEF2FC}

.drop{display:block;border:2px dashed #A9B7DA;border-radius:14px;padding:18px;text-align:center;background:#F6F8FD;color:var(--blue-d);font-weight:700}
.drop small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.drop input{display:none}
.unk{background:#FFFBEA;border:1px solid #F0E2A6;border-radius:12px;padding:10px 12px;margin-top:10px}
.unk select{padding:7px;border-radius:8px;border:1px solid var(--rule);max-width:150px}
textarea.json{width:100%;min-height:110px;font:12px/1.3 Consolas,monospace;border:1px solid var(--rule);border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;bottom:calc(48px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:11px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:40;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:360px){.shelf{grid-template-columns:repeat(3,1fr)}.pgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<button id="status" data-a="retry">Chargement…</button>
<div id="app"><div class="empty" style="padding-top:40vh">Chargement…</div></div>
<div id="sheet"><div class="bg" data-a="closeSheet"></div><div class="panel" id="panel"></div></div>
<div id="toast"></div>

function migrate(s) {

let S = null;
const prod = id => S.products.find(p => p.id === id);
const player = id => S.players.find(p => p.id === id);
const byDt = (a, b) => a.dt.localeCompare(b.dt);
const byType = (all) => TYPES.map(t => [t, S.products.filter(p => p.type === t && (all || p.actif))]).filter(([, l]) => l.length);
const invs = () => [...S.inventaires].sort(byDt);
const lastInv = () => { const l = invs(); return l[l.length - 1] || { dt: '0000', counts: {} }; };
// entrées en stock (achats + apports en nature) entre deux instants
function entrees(t0, t1) {
  const e = {};
  S.achats.forEach(a => { if (a.dt > t0 && a.dt <= t1) a.lignes.forEach(l => e[l.pid] = (e[l.pid] || 0) + l.qty); });
  S.versements.forEach(v => { if (v.nature && v.dt > t0 && v.dt <= t1) e[v.pid] = (e[v.pid] || 0) + v.qty; });
  return e;
}
function stockOf(pid) { const li = lastInv(); return (li.counts[pid] || 0) + (entrees(li.dt, '9999')[pid] || 0); }
// consommation mesurée entre chaque inventaire
function periodes() {
  const l = invs(), out = [];
  for (let i = 1; i < l.length; i++) {
    const a = l[i - 1], b = l[i], e = entrees(a.dt, b.dt), conso = {};
    let valeur = 0;
    S.products.forEach(p => { const q = (a.counts[p.id] || 0) + (e[p.id] || 0) - (b.counts[p.id] || 0); if (q) { conso[p.id] = q; valeur += q * (p.prix || 0); } });
    const aps = S.aperos.filter(x => x.dt > a.dt && x.dt <= b.dt);
    out.push({ from: a, to: b, conso, valeur, nbAperos: aps.length, presences: aps.reduce((s, x) => s + x.participants.length, 0) });
  }
  return out;
}
function stats() {
  const per = periodes();
  const valeur = per.reduce((s, p) => s + p.valeur, 0);
  const nbMes = per.reduce((s, p) => s + p.nbAperos, 0);
  const presMes = per.reduce((s, p) => s + p.presences, 0);
  const conso = {}; per.forEach(p => Object.entries(p.conso).forEach(([k, q]) => conso[k] = (conso[k] || 0) + q));
  return { valeur, nbMes, presMes, conso, nb: S.aperos.length, parApero: nbMes ? valeur / nbMes : 0, parGars: presMes ? valeur / presMes : 0 };
}
function money() {
  const verse = S.versements.filter(v => !v.nature).reduce((s, v) => s + v.montant, 0);
  const nature = S.versements.filter(v => v.nature).reduce((s, v) => s + v.montant, 0);
  const depense = S.achats.filter(a => a.caisse).reduce((s, a) => s + a.total, 0);
  const courses = S.achats.reduce((s, a) => s + a.total, 0);
  return { verse, nature, depense, courses, caisse: S.resteN1 + verse - depense };
}
function bilan() {
  const st = stats();
  return S.players.map(p => {
    const nb = S.aperos.filter(a => a.participants.includes(p.id)).length;
    const donne = S.versements.filter(v => v.playerId === p.id).reduce((s, v) => s + v.montant, 0);
    return { p, nb, donne, ratio: nb ? donne / nb : null, ok: nb ? donne / nb >= st.parGars - 0.005 : null };
  });
}
function nextSeason(n) { const m = String(n).match(/^(\d{4})\s*-\s*(\d{2,4})$/); return m ? (+m[1] + 1) + '-' + String((+m[2] + 1) % 100).padStart(2, '0') : n; }
function prevSeason(n) { const m = String(n).match(/^(\d{4})\s*-\s*(\d{2,4})$/); return m ? (+m[1] - 1) + '-' + String((+m[2] + 99) % 100).padStart(2, '0') : ''; }
const archSorted = () => [...S.archives].sort((a, b) => b.season.localeCompare(a.season));

function parsePaste(txt) {
  const out = [];
  String(txt || '').split(/\r?\n/).forEach(l => {
    const c = l.split(/\t|;/).map(x => x.trim()).filter(x => x !== '');
    if (c.length < 2) return;
    const name = c[0]; if (!/[a-zA-ZÀ-ÿ]/.test(name) || /^(nom|joueur|total)/i.test(name)) return;
    const n = c.slice(1).map(x => x.replace(/[€\s]/g, '')).filter(x => /^-?\d+([.,]\d+)?$/.test(x)).map(num);
    if (!n.length) return;
    out.push({ name, nb: n.length > 1 ? Math.round(n[0]) : '', donne: n.length > 1 ? n[1] : n[0] });
  });

}

let saveT = null, saving = false, dirty = false, errKind = null;
function setStatus(k, msg) {
  const b = document.getElementById('status');
  b.className = k === 'err' ? 'err' : '';
  b.textContent = k === 'ok' ? (online() ? 'Enregistré ✓' : 'Enregistré (local)') : k === 'pending' ? 'Enregistrement…' : (msg || 'Erreur, toucher pour réessayer');
}
function commit(msg) { render(); if (msg) toast(msg); dirty = true; setStatus('pending'); clearTimeout(saveT); saveT = setTimeout(save, 600); }
async function save() {
  if (saving || syncing) { saveT = setTimeout(save, 400); return; }
  saving = true; dirty = false; errKind = null;
  try {
    const payload = JSON.stringify(S);
    S.rev = await backend.save(payload);
    if (MODE === 'api') try { localStorage.setItem(KEY + '-cache', JSON.stringify(S)); } catch (e) {}
    setStatus(dirty ? 'pending' : 'ok');
  } catch (e) {
    const conflit = /CONFLIT/.test(String(e && e.message || e));
    errKind = conflit ? 'conflit' : 'err'; if (!conflit) toast(niceErr(e));
    setStatus('err', conflit ? 'Modifié ailleurs, toucher pour recharger' : null);
  }
  saving = false;
}
let syncing = false;
function niceErr(e) {
  const m = String(e && e.message || e);
  if (/fetch|NetworkError|Load failed/i.test(m)) return navigator.onLine === false ? 'Pas de réseau' : 'Google Sheet injoignable (déploiement en accès « Tout le monde » ?)';
  return m;
}
async function load() {
  document.getElementById('status').textContent = 'Chargement…';
  if (MODE === 'local' && HOSTED) { S = seed(); screen = 'setup'; render(); setStatus('err', 'Non configurée'); return; }
  // Appli installée : affiche tout de suite la dernière copie, puis met à jour depuis le Sheet
  const cache = MODE === 'api' && localStorage.getItem(KEY + '-cache');
  const shown = cache ? migrate(JSON.parse(cache)) : null;
  if (shown) { S = shown; render(); document.getElementById('status').textContent = 'Mise à jour…'; }
  let raw = null; syncing = true;
  try { raw = await backend.load(); }
  catch (e) {
    syncing = false;
    if (shown) { errKind = 'load'; setStatus('err', 'Hors ligne, toucher pour réessayer'); return; }
    setStatus('err', 'Chargement impossible, toucher pour réessayer'); errKind = 'load'; toast(niceErr(e)); return;
  }
  syncing = false;
  const fromSheet = raw ? migrate(JSON.parse(raw)) : null;
  if (raw && !fromSheet) { // données dans un format inattendu : on ne touche à rien
    if (!S) S = seed(); errKind = 'load'; setStatus('err', 'Données illisibles, rien n’a été modifié');
    toast('Les données du Google Sheet n’ont pas pu être lues. Rien n’a été écrasé.'); saving = true; render(); return;
  }
  if (MODE === 'api' && raw) try { localStorage.setItem(KEY + '-cache', raw); } catch (e) {}
  if (shown && fromSheet && fromSheet.rev === shown.rev) { if (!dirty) setStatus('ok'); return; } // copie déjà à jour
  if (shown && dirty) { clearTimeout(saveT); dirty = false; toast('Données mises à jour depuis le Sheet : refais ta dernière saisie.'); }

  if (fresh) commit(); else setStatus('ok');
}

V.apero = () => {
  const a = S.aperos.find(x => x.id === U.apId);
  const f = freq();
  const list = S.players.filter(p => p.actif || (a && a.participants.includes(p.id)))
    .sort((x, y) => (f[y.id] || 0) - (f[x.id] || 0) || x.name.localeCompare(y.name));
  const present = a ? a.participants : [];
  const vs = a ? S.versements.filter(v => v.apId === a.id) : [];
  const givers = a ? S.players.filter(p => present.includes(p.id) || vs.some(v => v.playerId === p.id)) : [];
  const recus = vs.reduce((s, v) => s + v.montant, 0);
  const prev = [...S.aperos].sort(byDt).reverse().filter(x => x.id !== U.apId).slice(0, 6);
  return topbar('Apéro', a ? fday(a.dt) : 'Touche les gars présents') + `
  ${a ? `<div class="when"><span class="muted">Date</span><input type="date" data-ap="dt" value="${a.dt.slice(0, 10)}"></div>` : ''}
  <div class="row" style="display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px"><span class="count">${present.length} présent${present.length > 1 ? 's' : ''}</span>${a && vs.length ? `<span class="muted">${eur(recus)} reçus</span>` : ''}</div>
  <div class="pgrid">${list.map(p => { const on = present.includes(p.id); return `<button class="pbtn ${on ? 'on' : ''}" data-a="togP" data-id="${p.id}"><i>${on ? '✓' : ''}</i>${esc(p.name)}</button>`; }).join('')}</div>
  <div class="card" style="margin-top:10px;display:flex;gap:8px;align-items:center"><input class="grow" style="padding:11px;border:1px solid var(--rule);border-radius:10px;background:var(--soft)" placeholder="Nouveau : Prénom Nom" data-f="newApPlayer" value="${esc(U.newApPlayer || '')}"><button class="btn" data-a="addApPlayer">+ Ajouter</button></div>
  ${a ? `<h2>Qui a donné quoi</h2>
  <div class="card">${givers.length ? givers.map(p => { const mine = vs.filter(v => v.playerId === p.id); return `<div class="line"><div class="grow"><div class="name">${esc(p.name)}</div>${mine.map(v => `<button class="chip x" data-a="delV" data-id="${v.id}" data-arm="1" title="Supprimer">${vLabel(v)} ✕</button>`).join('')}</div><button class="btn small ${mine.length ? 'ghost' : ''}" data-a="give" data-id="${p.id}">+ Donner</button></div>`; }).join('') : '<div class="empty">Coche les présents pour noter ce qu’ils donnent.</div>'}</div>

  ${a ? '' : '<div class="btns" style="margin-top:14px"><button class="btn ghost wide" data-a="go" data-s="home">Annuler</button></div>'}`;

V.invDetail = () => {

  <div class="when"><span class="muted">Date</span><input type="date" data-f="invEdit.date" value="${ed.date}"></div>
  <div class="card">${list.map(([t, pl]) => `<div class="group">${t}</div>` + pl.map(p => `<div class="line"><div class="grow"><div class="name">${esc(p.name)}</div><div class="muted">avant : ${inv.counts[p.id] || 0}</div></div>${stepper('invEdit.counts.' + p.id, ed.counts[p.id] || 0)}</div>`).join('')).join('')}
  <div class="btns" style="margin-top:12px"><button class="btn red wide" data-a="saveInvEdit">Enregistrer les modifications</button><button class="btn ghost wide" data-a="cancelInvEdit">Annuler</button></div></div>`;
  return topbar('Inventaire du ' + fday(inv.dt).replace(/^\S+ /, ''), 'Ce que tu as compté ce jour-là', 'inventaire', 'Inventaire') + head + `
  <div class="card">${list.map(([t, pl]) => `<div class="group">${t}</div>` + pl.map(p => { const c = per ? per.conso[p.id] || 0 : 0; return `<div class="line"><div class="grow"><div class="name">${esc(p.name)}</div>${c ? `<div class="muted">${c > 0 ? c + ' consommé' + (c > 1 ? 's' : '') + ', ' + eur(c * (p.prix || 0)) : (-c) + ' en trop par rapport au stock attendu'}</div>` : ''}</div><span class="num" style="font:800 1.5rem var(--cond)">${inv.counts[p.id] || 0}</span></div>`; }).join('')).join('')}</div>

};

/* ================= Scan de ticket ================= */
function parseTicket(text) {
  // Lecture pensée pour les tickets Super U (Magasins U), avec repli générique pour les autres enseignes.
  const lines = String(text).split(/\r?\n/).map(norm).filter(Boolean);
  const PRICE = /(-?\d{1,4}[.,]\d{2})\s*(?:€|EUR)?(?:\s+(?:\d{1,2}|[A-Z]\d?|\*))?\s*$/;
  const MULT = /^(\d{1,3})\s*[X*×]\s*(\d{1,4}[.,]\d{2})\s*(?:€|EUR)?/;
  const SKIP = /TVA|CARTE|\bCB\b|VISA|MASTERCARD|RENDU|ESPECES|MONTANT|MERCI|FIDELIT|CAGNOT|SIRET|TEL\b|TELEPHONE|NB ARTICLE|NOMBRE DE LIGNES|TICKET|MAGASIN|HORAIRE|PAIEMENT|SANS CONTACT|AUTORIS|ELIGIBLES|SOLDE|VIGNETTE|\*{3,}/;
  const items = [], reductions = [];
  let ticketTotal = null, paid = null, date = null, dateAny = null, pendingName = null, phase = 'items';
  for (const L of lines) {
    const dt = L.match(/\b(\d{2})\/(\d{2})\/(\d{2}|\d{4})\s+\d{2}:\d{2}/);
    if (dt && !date) date = (dt[3].length === 2 ? '20' + dt[3] : dt[3]) + '-' + dt[2] + '-' + dt[1];
    const da = L.match(/\b(\d{2})[\/.-](\d{2})[\/.-](20\d{2})\b/);
    if (da && !dateAny && +da[2] <= 12) dateAny = da[3] + '-' + da[2] + '-' + da[1];
    const pm = L.match(PRICE), price = pm ? num(pm[1]) : null;
    if (/RESTE A PAYER|NET A PAYER|MONTANT A PAYER/.test(L)) { if (pm) paid = price; phase = 'after'; continue; }
    if (/\bTOTAL\b/.test(L) && !/SOUS.?TOTAL|TVA|REDUC|REMISE/.test(L)) { if (pm && ticketTotal == null) ticketTotal = price; phase = 'after'; continue; }
    if (/SOUS.?TOTAL|TOTAL (TVA|REDUC|REMISE)/.test(L)) { phase = 'after'; continue; }
    if (pm && price < 0) { // réduction : « 2 x 3.75€ LOT 2 BIERE HEINEKEN X12  -7,50 € »
      reductions.push({ text: L.slice(0, pm.index).replace(MULT, '').trim(), amount: -price }); continue;
    }
    if (phase !== 'items') continue;               // après le total : gains carte, TVA, promos… ignorés
    const mm = L.match(MULT);
    if (mm && !/[A-Z]{3}/.test(L.slice(mm[0].length))) { // ligne quantité « 4 x 7,50 EUR »
      const q = +mm[1], unit = num(mm[2]);
      const tail = L.slice(mm[0].length).match(PRICE);
      const lineTot = tail ? num(tail[1]) : r2(q * unit);
      const prev = items[items.length - 1];
      if (pendingName) { items.push({ text: pendingName, price: lineTot, qty: q }); pendingName = null; }
      else if (prev && prev.qty === 1 && Math.abs(prev.price - r2(q * unit)) < 0.03) prev.qty = q;
      continue;
    }
    if (SKIP.test(L)) { pendingName = null; continue; }
    if (!pm) { pendingName = /[A-Z]{3}/.test(L) ? L : null; continue; } // rayon (CHIPS, TRAITEUR…) ou nom sans prix
    const name = L.slice(0, pm.index).replace(/[€*]+\s*$/, '').trim();
    if (!/[A-Z]{2}/.test(name)) continue;
    items.push({ text: name, price, qty: 1 }); pendingName = null;
  }
  // chaque réduction est retirée de l'article correspondant (sinon du dernier)
  reductions.forEach(r => {
    const p = matchProduct(r.text);
    const it = (p && items.find(i => matchProduct(i.text) === p)) || items.find(i => r.text.split(' ').some(w => w.length > 4 && i.text.includes(w))) || items[items.length - 1];
    if (it) { it.price = r2(it.price - r.amount); it.remise = r2((it.remise || 0) + r.amount); }
  });
  return { items, ticketTotal, paid, date: date || dateAny };
}
function matchProduct(name) {
  let best = null, pos = 1e9, len = 0;
  S.products.forEach(p => (p.alias || []).forEach(a => {
    const A = norm(a); if (!A) return;
    const i = name.indexOf(A);
    if (i >= 0 && (i < pos || (i === pos && A.length > len))) { best = p; pos = i; len = A.length; }
  }));
  return best;
}
function unitsFor(name, p, qty) {
  // pack détecté sur le ticket : 12X25CL, 6X1,75L, X12…
  const pk = name.match(/\b(\d{1,2})\s*X\s*\d{1,3}(?:[.,]\d+)?\s*(?:CL|L|ML)\b/) || name.match(/\bX\s*(\d{1,2})\b/);
  return qty * (pk ? +pk[1] : (p.lot || 1));
}
function applyTicket(res) {
  const d = newDraft(); d.fromTicket = true; d.ticketTotal = res.paid ?? res.ticketTotal;
  if (res.date) d.date = res.date;
  let total = 0; d.lines = [];
  res.items.forEach(it => {
    const p = matchProduct(it.text);
    if (p) { const u = unitsFor(it.text, p, it.qty); d.qty[p.id] = (d.qty[p.id] || 0) + u; total += it.price; d.lines.push({ pid: p.id, units: u, price: it.price, text: it.text }); }
    else d.unknown.push({ text: it.text, price: it.price, qty: it.qty, pid: '' });
  });
  d.total = total ? String(r2(total)).replace('.', ',') : '';
  U.draft = d;
  const ok = res.items.length - d.unknown.length;
  const reste = d.ticketTotal != null ? r2(d.ticketTotal - total) : 0;
  U.scan = !res.items.length ? 'Aucun article lu. Réessaie avec une photo plus nette, bien à plat, ou saisis à la main.'
    : ok + ' article' + (ok > 1 ? 's' : '') + ' reconnu' + (ok > 1 ? 's' : '') + (d.unknown.length ? ', ' + d.unknown.length + ' à vérifier' : '') + '. '
      + (d.ticketTotal != null ? (Math.abs(reste) < 0.01 ? 'Le total correspond au ticket (' + eur(d.ticketTotal) + ').' : 'Ticket : ' + eur(d.ticketTotal) + ', dont ' + eur(reste) + ' hors buvette.') : '');
}
async function pdfText(file) {
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base + 'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent();
    const its = tc.items.filter(i => i.str.trim()).sort((a, b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
    let row = [], y = null;
    const flush = () => { if (row.length) out.push(row.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ')); row = []; };
    its.forEach(i => { const yy = i.transform[5]; if (y !== null && Math.abs(yy - y) > 2.5) flush(); if (!row.length) y = yy; row.push(i); });
    flush();
  }
  return out.join('\n');
}
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1800 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; const x = c.getContext('2d'); x.filter = 'grayscale(1) contrast(1.3)'; x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85)); };
    img.onerror = () => rej(new Error('Image illisible')); img.src = url;
  });
}
async function imageText(file) {
  const data = await shrink(file);
  if (online()) return await backend.ocr(data.split(',')[1], 'image/jpeg');
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const r = await Tesseract.recognize(data, 'fra', { logger: m => { if (m.status === 'recognizing text') { U.scan = 'Lecture du ticket… ' + Math.round(m.progress * 100) + ' %'; const el = document.querySelector('#app p.muted'); if (el) el.textContent = U.scan; } } });
  return r.data.text;
}
async function scan(file) {
  U.scan = 'Lecture du ticket…'; render();
  try {
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const text = isPdf ? await pdfText(file) : await imageText(file);
    if (isPdf && text.replace(/\s/g, '').length < 20) { U.scan = 'Ce PDF ne contient que des images. Prends plutôt une photo du ticket.'; render(); return; }
    applyTicket(parseTicket(text));
  } catch (e) { U.scan = 'Lecture impossible (' + (e.message || e) + '). Saisis les courses à la main.'; }
  render();
}

    const a = S.archives.find(x => x.id === U.archView), rows = a.players.map(x => ({ name: x.name, nb: String(x.nb), donne: String(x.donne).replace('.', ','), fixed: true }));
    S.players.forEach(p => { if (!rows.some(r => norm(r.name) === norm(p.name))) rows.push({ name: p.name, nb: '', donne: '', fixed: true }); });
    U.arch = { id: a.id, season: a.season, nbAperos: String(a.nbAperos), parApero: String(a.parApero).replace('.', ','), parGars: String(a.parGars).replace('.', ','), caisseFin: a.caisseFin == null ? '' : String(a.caisseFin).replace('.', ','), paste: '', rows };
    go('archEdit');
  },
  archRow: () => { U.arch.rows.push({ name: '', nb: '', donne: '', fixed: false }); render(); },
  archPaste: () => {
    const got = parsePaste(U.arch.paste); if (!got.length) return toast('Rien de reconnu : il faut Nom, Apéros, Donné par ligne');
    got.forEach(g => { const r = U.arch.rows.find(x => norm(x.name) === norm(g.name)); if (r) { r.nb = String(g.nb); r.donne = String(g.donne).replace('.', ','); } else U.arch.rows.push({ name: g.name, nb: String(g.nb), donne: String(g.donne).replace('.', ','), fixed: false }); });
    U.arch.paste = ''; render(); toast(got.length + ' ligne' + (got.length > 1 ? 's' : '') + ' reprise' + (got.length > 1 ? 's' : ''));
  },
  saveArch: () => {
    const f = U.arch; if (!f.season.trim()) return toast('Indique la saison');
    if (S.archives.some(a => a.season === f.season.trim() && a.id !== f.id) || (f.season.trim() === S.season)) return toast('Cette saison existe déjà');
    const players = f.rows.filter(r => r.name.trim() && (num(r.nb) > 0 || num(r.donne) > 0)).map(r => ({ name: r.name.trim(), nb: Math.round(num(r.nb)), donne: r2(num(r.donne)) }));
    const nbA = Math.round(num(f.nbAperos)), pres = players.reduce((s, x) => s + x.nb, 0);
    let pa = num(f.parApero), pg = num(f.parGars);
    if (!pg && pa && nbA && pres) pg = pa * nbA / pres;
    if (!pa && pg && nbA && pres) pa = pg * pres / nbA;
    const a = { id: f.id || uid(), season: f.season.trim(), date: sessionDate(), source: 'manuel', nbAperos: nbA, parApero: r2(pa), parGars: r2(pg), valeur: r2(pa * nbA), caisseFin: f.caisseFin === '' ? null : r2(num(f.caisseFin)), donneTotal: r2(players.reduce((s, x) => s + x.donne, 0)), courses: null, players, conso: [] };
    const i = S.archives.findIndex(x => x.id === a.id); i >= 0 ? S.archives[i] = a : S.archives.push(a);
    U.arch = null; U.archView = a.id; screen = 'archive'; commit('Bilan ' + a.season + ' enregistré');
  },
  newSeason: () => {
    const m = money(), counts = {};
    S.archives.push(snapshotSeason());
    S.products.forEach(p => { const q = stockOf(p.id); if (q) counts[p.id] = q; });
    S.inventaires = [{ id: uid(), dt: sessionDate() + 'T23:59', counts, note: 'Reste de la saison passée' }];
    S.resteN1 = r2(m.caisse); S.aperos = []; S.achats = []; S.versements = [];
    S.players.forEach(p => { p.licence = p.paiement = p.chaussette = false; });
    const old = S.season; S.season = nextSeason(S.season);
    commit('Saison ' + old + ' archivée, bonne saison ' + S.season);
  },
  export: () => { U.io = JSON.stringify(S); render(); const t = document.querySelector('textarea.json'); t.focus(); t.select(); toast('Sélectionne et copie le texte'); },
  import: () => { try { const d = migrate(JSON.parse(U.io)); if (!d) throw 0; d.rev = S.rev; S = d; U.io = ''; commit('Sauvegarde importée'); } catch (e) { toast('Texte invalide, rien n’a été importé'); } },
  reseed: () => { const rev = S.rev; S = seed(); S.rev = rev; commit('Données de départ rechargées'); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'INPUT') return;
  if (b.dataset.arm && !b.classList.contains('arm')) {
    const old = b.innerHTML; b.classList.add('arm'); b.textContent = 'Confirmer ?';
    setTimeout(() => { if (document.body.contains(b)) { b.classList.remove('arm'); b.innerHTML = old; } }, 3000);
    return;
  }
  const fn = A[b.dataset.a]; if (fn) fn(b.dataset, b);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) {
    const v = t.type === 'checkbox' ? t.checked : t.value;
    setPath(t.dataset.f, /^(draft\.qty|inv|sheet\.qty|invEdit\.counts|achatEdit\.qty)\./.test(t.dataset.f) ? num(v) : v);
    if (t.dataset.f === 'sheet.montant') { const q = document.querySelectorAll('.quick button'); q.forEach(x => x.classList.toggle('on', num(x.dataset.v) === num(v))); const s = document.querySelector('[data-a=shSave]'); if (s) s.textContent = num(v) > 0 ? 'Valider ' + eur0(num(v)) : 'Valider'; }
    if (t.dataset.f === 'draft.total') { const b = document.querySelector('.total b'); if (b) b.textContent = eur(num(v)); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.s) { S[t.dataset.s] = t.dataset.s === 'resteN1' ? r2(num(t.value)) : t.value; commit(); }
  if (t.dataset.ap) { const a = S.aperos.find(x => x.id === U.apId); if (a && t.value) { a.dt = t.value + 'T20:00'; S.versements.forEach(v => { if (v.apId === a.id) v.dt = a.dt; }); commit(); } }
  if (t.dataset.unk != null) { const u = U.draft.unknown[+t.dataset.unk]; const was = u.pid; u.pid = t.value; const tot = num(U.draft.total) + (u.pid && !was ? u.price : !u.pid && was ? -u.price : 0); U.draft.total = String(r2(tot)).replace('.', ','); render(); }
  if (t.dataset.a === 'scanFile' && t.files[0]) { const f = t.files[0]; t.value = ''; scan(f); }
  if (/^(draft\.qty|inv|invEdit\.counts|achatEdit\.qty)\./.test(t.dataset.f || '')) render();
});

if (HOSTED && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
